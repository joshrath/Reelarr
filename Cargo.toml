[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/joshrath/Reelarr"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
leptos = "0.8.23"
leptos_router = "0.8"
leptos_meta = "0.8"
leptos_axum = "0.8.10"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"

# cargo-leptos build: `cargo leptos build --release` / `cargo leptos watch`.
[[workspace.metadata.leptos]]
name = "reelarr"
bin-package = "reelarr-server"
bin-target = "reelarr"
bin-exe-name = "reelarr"
lib-package = "reelarr-ui"
bin-features = []
lib-features = ["hydrate"]
lib-default-features = false
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "crates/reelarr-ui/style/main.css"
assets-dir = "crates/reelarr-ui/public"
site-addr = "127.0.0.1:7979"
reload-port = 7980
env = "DEV"
