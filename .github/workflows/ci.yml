name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Clippy (server, UI with ssr)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (UI with hydrate, wasm32)
        run: cargo clippy -p reelarr-ui --lib --target wasm32-unknown-unknown --features hydrate -- -D warnings
      - run: cargo test --workspace

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: reelarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name reelarr -p 7979:7979 reelarr:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:7979/health && break; sleep 1; done
          curl -fsS http://localhost:7979/ | grep -q 'aria-label="Main"'
          # The release image is the only cargo-leptos build in CI, so check
          # the site assets it ships.
          for f in reelarr.wasm reelarr.js reelarr.css; do
            curl -fsS -o /dev/null "http://localhost:7979/pkg/$f"
          done
          curl -fsSI http://localhost:7979/ | grep -qi '^x-content-type-options: nosniff'
          docker rm -f reelarr
