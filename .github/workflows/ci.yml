name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_LEPTOS_VERSION: 0.3.11

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Clippy (server, UI with ssr)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (UI with hydrate, wasm32)
        run: cargo clippy -p reelarr-ui --lib --target wasm32-unknown-unknown --features hydrate -- -D warnings
      - run: cargo test --workspace

  cargo-deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # v2.1.1, bundles cargo-deny 0.20.2; keep local and CI versions aligned.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: stable
          arguments: --locked --all-features
          command: check
          # Only the unmaintained lint is downgraded, as policy requests.
          # Vulnerabilities/unsoundness remain errors; no ignored advisories.
          command-arguments: --warn unmaintained

  ui-build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@${{ env.CARGO_LEPTOS_VERSION }}
      - name: Build server and site
        run: cargo leptos build --release
      - name: Check site assets
        run: |
          test -s target/site/pkg/reelarr.wasm
          test -s target/site/pkg/reelarr.js
          test -s target/site/pkg/reelarr.css

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: reelarr:ci
      - name: Smoke test container
        run: |
          docker run -d --name reelarr -p 7979:7979 reelarr:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:7979/health && break; sleep 1; done
          curl -fsS http://localhost:7979/ | grep -q 'aria-label="Main"'
          curl -fsS -o /dev/null http://localhost:7979/pkg/reelarr.wasm
          docker rm -f reelarr
