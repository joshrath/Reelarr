[package]
name = "reelarr-db"
description = "Persistence layer (sqlx + SQLite)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reelarr-core = { version = "0.0.1", path = "../reelarr-core" }
reelarr-indexer = { version = "0.0.1", path = "../reelarr-indexer" }
reelarr-nzb = { version = "0.0.1", path = "../reelarr-nzb" }
reelarr-types = { version = "0.0.1", path = "../reelarr-types" }
serde = { workspace = true }
serde_json = { workspace = true }
chacha20poly1305 = "0.10.1"
base64 = "0.22"
zeroize = "1"
tempfile = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
