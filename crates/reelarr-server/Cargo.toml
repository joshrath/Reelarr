[package]
name = "reelarr-server"
description = "Reelarr server binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "reelarr"
path = "src/main.rs"

[dependencies]
reelarr-db = { version = "0.0.1", path = "../reelarr-db" }
reelarr-types = { version = "0.0.1", path = "../reelarr-types" }
reelarr-ui = { version = "0.0.1", path = "../reelarr-ui", features = ["ssr"] }
leptos = { workspace = true, features = ["ssr"] }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reelarr-core = { version = "0.0.1", path = "../reelarr-core" }
reelarr-stream = { version = "0.0.1", path = "../reelarr-stream" }
reelarr-media = { version = "0.0.1", path = "../reelarr-media" }
serde = { workspace = true }
subtle = "2"

[dev-dependencies]
sqlx = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
