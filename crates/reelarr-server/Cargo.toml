[package]
name = "reelarr-server"
description = "Reelarr server binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "reelarr"
path = "src/main.rs"

[dependencies]
reelarr-db = { version = "0.0.1", path = "../reelarr-db" }
reelarr-indexer = { version = "0.0.1", path = "../reelarr-indexer" }
reelarr-nzb = { version = "0.0.1", path = "../reelarr-nzb" }
reelarr-types = { version = "0.0.1", path = "../reelarr-types" }
reelarr-ui = { version = "0.0.1", path = "../reelarr-ui", features = ["ssr"] }
leptos = { workspace = true, features = ["ssr"] }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reelarr-core = { version = "0.0.1", path = "../reelarr-core" }
reelarr-stream = { version = "0.0.1", path = "../reelarr-stream" }
reelarr-media = { version = "0.0.1", path = "../reelarr-media" }
serde = { workspace = true }
subtle = "2"
async-trait = { workspace = true }
thiserror = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
crc32fast = "1.5"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sqlx = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
wiremock = "0.6"
