[package]
name = "reelarr-ui"
description = "Leptos web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { workspace = true }
leptos_router = { workspace = true }
leptos_meta = { workspace = true }
reelarr-types = { version = "0.0.1", path = "../reelarr-types" }
serde = { workspace = true }

# Server-side rendering (native).
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

# Client-side hydration (wasm32).
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
# Always on so SSR type-checks the DOM calls too.
web-sys = { workspace = true, features = ["Document", "Element", "HtmlDocument"] }

[features]
default = []
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos_meta/ssr",
]
hydrate = [
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "leptos/hydrate",
]

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
