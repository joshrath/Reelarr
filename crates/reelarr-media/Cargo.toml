[package]
name = "reelarr-media"
description = "Library scanning, import, rename and metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reelarr-types = { version = "0.0.1", path = "../reelarr-types" }
reelarr-db = { version = "0.0.1", path = "../reelarr-db" }
reelarr-stream = { version = "0.0.1", path = "../reelarr-stream" }
sqlx = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = "0.3"
thiserror = "2"
tokio = { workspace = true }
tracing = { workspace = true }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["test-util"] }
