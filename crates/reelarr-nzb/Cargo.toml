[package]
name = "reelarr-nzb"
description = "Built-in NZB download client (NNTP, yEnc, repair, extract)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reelarr-core = { version = "0.0.1", path = "../reelarr-core" }
reelarr-rar = { version = "0.0.1", path = "../reelarr-rar" }
async-trait.workspace = true
quick-xml = "0.42"
crc32fast = "1.5"
thiserror = "2"
tokio.workspace = true
tracing.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile.workspace = true
reelarr-types = { version = "0.0.1", path = "../reelarr-types" }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
